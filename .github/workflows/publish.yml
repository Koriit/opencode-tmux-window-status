# Publish to npm
#
# Maintainer prerequisites
# ========================
# 1. Create an npm **automation** access token with publish rights for the @koriit
#    scope and add it as the repo secret NPM_TOKEN
#    (Settings → Secrets and variables → Actions).
# 2. To release: bump `version` in package.json, commit, then create a GitHub
#    Release with tag v<version> (e.g. v0.1.0). That triggers this workflow,
#    which type-checks and publishes to npm with provenance. The manual
#    workflow_dispatch trigger is a fallback (it skips the tag/version check).

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install tmux (for e2e tests)
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Type-check
        run: bun run typecheck

      - name: Test (unit + e2e, with coverage gate)
        run: bun test --coverage

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json has $PKG_VERSION but release tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
